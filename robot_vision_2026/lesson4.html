<h1 id="%E3%83%AD%E3%83%9C%E3%83%83%E3%83%88%E3%83%93%E3%82%B8%E3%83%A7%E3%83%B3">ロボットビジョン</h1>
<h2 id="%E7%AC%AC4%E5%9B%9E-%E7%94%BB%E5%83%8F%E3%81%AE%E8%A8%98%E6%86%B6%E3%81%A8%E5%86%8D%E7%94%9F%E3%83%BB%E7%94%9F%E6%88%90">第4回: 画像の記憶と再生・生成</h2>
<p>千葉工業大学 上田 隆一</p>
<br />

<footer>ロボットビジョン第4回</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="2" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h2 id="%E4%BB%8A%E6%97%A5%E3%82%84%E3%82%8B%E3%81%93%E3%81%A8">今日やること</h2>
<ul>
<li>敵対的生成ネットワーク（GAN）</li>
<li>オートエンコーダ（AE）</li>
<li>変分オートエンコーダ（VAE）</li>
<li>拡散モデル（DDPM）</li>
<li>フローマッチング（FM）</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="3" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h2 id="gangenerative-adversarial-networksgoodfellow2014">GAN（generative adversarial networks）<a href="https://papers.nips.cc/paper_files/paper/2014/file/f033ed80deb0234979a61f95710dbe25-Paper.pdf">[Goodfellow2014]</a></h2>
<ul>
<li>敵対的生成ネットワーク
<ul>
<li>「絵を描く人工ニューラルネットワーク」のブームの発端</li>
<li>それ以外にも音声やソフトウェアを作り出すなどの用途</li>
</ul>
</li>
<li>「敵対的」とは何?（人類の敵ではない）
<ul>
<li>ふたつのANNを準備
<ul>
<li>生成ネットワーク（generator）: 何かを作るANN</li>
<li>識別ネットワーク（discriminator）: 入力が生成ネットワークの生成物かどうかを判断するANN</li>
</ul>
</li>
<li>生成ネットワークと識別ネットワークが互いに競う</li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="4" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h3 id="%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E6%A7%8B%E9%80%A0%E3%81%AE%E4%BE%8Bdcgan">ネットワーク構造の例（DCGAN）</h3>
<ul>
<li>Deep Convlutional GAN（DCGAN）<a href="https://arxiv.org/pdf/1511.06434">[Radford 2015]</a> <a href="https://www.researchgate.net/figure/The-architecture-of-the-generator-and-the-discriminator-in-a-DCGAN-model-FSC-is-the_fig4_343597759"><span style="font-size:70%">画像: Zhang et al. CC-BY 4.0</span></a>
<ul>
<li>上: 生成ネットワーク<span style="font-size:70%">（FSC: fractionally-strided convolution、つまり転置畳み込み)</span></li>
<li>下: 識別ネットワーク<br />
<img src="./figs/dcgan-cc-by-4.0-by_zhang.png" alt="" style="width:800px;" /></li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="5" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="40" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./figs/dcgan-cc-by-4.0-by_zhang.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="5" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="5" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="40" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="dcgan%E3%81%AE%E7%94%9F%E6%88%90%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E5%8F%B3%E5%9B%B3%E3%81%AE%E4%B8%8A">DCGANの生成ネットワーク（右図の上）</h3>
<ul>
<li>構造: U-Netの出力側
<ul>
<li>入力: ランダムなベクトル（100次元）
<ul>
<li>つまり雑音を入力
<ul>
<li>なんで？？（講義後半で）</li>
</ul>
</li>
</ul>
</li>
<li>出力: 画像</li>
</ul>
</li>
<li>出力の画像は最初はでたらめ
<ul>
<li><span style="color:red">ある訓練</span>をすると画像が生成されるように</li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="5" style="" data-marpit-pagination-total="40" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="6" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="40" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./figs/dcgan-cc-by-4.0-by_zhang.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="6" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="6" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="40" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="dcgan%E3%81%AE%E8%AD%98%E5%88%A5%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF">DCGANの識別ネットワーク</h3>
<ul>
<li>構造: エンコーダに似ているが出力は1bit
<ul>
<li>入力: 次のどちらか
<ul>
<li>生成画像: 生成ネットワークから</li>
<li>訓練画像: 顔なら顔、風景なら風景の画像セット数千枚〜</li>
</ul>
</li>
<li>出力: 訓練画像である確率
<ul>
<li>偽物: 生成画像</li>
<li>最終層（シグモイド）が<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="5.28ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 2333.6 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g><g data-mml-node="mo" transform="translate(777.8,0)"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g><g data-mml-node="mn" transform="translate(1833.6,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container>を出力</li>
<li>最初は当てずっぽう</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="6" style="" data-marpit-pagination-total="40" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="7" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h3 id="%E7%94%9F%E6%88%90%E8%AD%98%E5%88%A5%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E3%82%92%E7%AB%B6%E3%82%8F%E3%81%9B%E3%82%8B">生成/識別ネットワークを競わせる</h3>
<ul>
<li>損失関数（次ページで詳しく）
<ul>
<li>識別ネットワークが正解したら生成ネットワークの損失</li>
<li>識別ネットワークが不正解だったら識別ネットワークの損失</li>
</ul>
</li>
<li>学習の進行
<ul>
<li>生成ネットワーク: ノイズ画像<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container>識別ネットワークの確率を下げる模様を生成<br />
<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container>精緻な画像</li>
<li>識別ネットワーク: 模様に負けない識別性能を得ようとする</li>
<li><a href="https://qiita.com/miya_ppp/items/f1348e9e73dd25ca6fb5">学習が進んでいく様子</a></li>
</ul>
</li>
</ul>
<center>これで生成ネットワークが画像を出力できるようになる <a href="https://arxiv.org/pdf/1511.06434">例</a></center>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="8" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">

<h3 id="gan%E3%81%AE%E3%81%BE%E3%81%A8%E3%82%81">GANのまとめ</h3>
<ul>
<li>GAN
<ul>
<li>2つのネットワークを競わせる</li>
<li>入力がノイズのことがある</li>
<li>画像を生成（生成モデルと呼ばれるものの先祖の1つ）
<ul>
<li>基本、画像やベクトルにできるデータならなんでも出力可能</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="10" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h2 id="%E3%82%AA%E3%83%BC%E3%83%88%E3%82%A8%E3%83%B3%E3%82%B3%E3%83%BC%E3%83%80%E3%81%A8%E6%BD%9C%E5%9C%A8%E7%A9%BA%E9%96%93">オートエンコーダと潜在空間</h2>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="11" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h3 id="%E7%96%91%E5%95%8F">疑問</h3>
<ul>
<li>なんで我々の頭にはSSDがついてないのに、風景をたくさん覚えていられるのか？
<ul>
<li>前来た場所を懐かしいと思える（たまに忘れる）</li>
<li>自分のいた教室と違う教室でも懐かしいと思う</li>
</ul>
</li>
<li>頭のなかで風景や動きを再生できる
<ul>
<li>見たことのあるもの</li>
<li>見たことのないものの空想/夢や病気での幻想</li>
</ul>
</li>
</ul>
<center>話し合ってみましょう</center>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="12" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h3 id="%E3%82%AA%E3%83%BC%E3%83%88%E3%82%A8%E3%83%B3%E3%82%B3%E3%83%BC%E3%83%80autoencoderae">オートエンコーダ（autoencoder、AE）</h3>
<ul>
<li>入力と出力を一致させるように学習されたANN <a href="https://www.cs.toronto.edu/~hinton/absps/science.pdf">[Hinton 2006]</a>
<ul>
<li>損失関数: 入出力の平均二乗誤差（MSE, mean square error）
<ul>
<li>学習のためのラベル付けは不要（教師無し）</li>
</ul>
</li>
<li>構成はCNNでも全結合でもよいが、U-Net状に中間の次元を小さく
<ul>
<li>入力側: どんどん情報を落としていく</li>
<li>出力側: どんどん情報を増やしていく</li>
</ul>
</li>
<li>疑問: 何の意味があるの？<br />
<img src="./figs/autoenc.png" alt="" style="width:900px;" /></li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="13" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="40" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./figs/encoder.png&quot;);background-size:95%;"></figure></div></section></foreignObject><foreignObject width="65%" height="720"><section id="13" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="13" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="40" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="%E5%85%A5%E5%8A%9B%E5%81%B4span-stylecolorred%E3%82%A8%E3%83%B3%E3%82%B3%E3%83%BC%E3%83%80span%E3%81%AE%E3%82%84%E3%81%A3%E3%81%A6%E3%81%84%E3%82%8B%E3%81%93%E3%81%A8">入力側（<span style="color:red">エンコーダ</span>）のやっていること</h3>
<ul>
<li>入力されたデータの分類
<ul>
<li>（学習がうまくいった場合は）似たような画像から似たような出力が得られる</li>
<li>うしろに全結合層（とソフトマックス層）をくっつけて追加で学習させると分類器に</li>
</ul>
</li>
<li>右図の例: 出力を2次元まで縮小した場合の<br />
出力の分布の例
<ul>
<li>注意: 実用的なものはもっと高次元
<ul>
<li>[Hinton 2026]は30次元</li>
</ul>
</li>
<li>分布している空間を<span style="color:red">潜在空間</span>と言う</li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="13" style="" data-marpit-pagination-total="40" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="14" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h3 id="%E5%87%BA%E5%8A%9B%E5%81%B4span-stylecolorred%E3%83%87%E3%82%B3%E3%83%BC%E3%83%80span%E3%81%AE%E3%82%84%E3%81%A3%E3%81%A6%E3%81%84%E3%82%8B%E3%81%93%E3%81%A8">出力側（<span style="color:red">デコーダ</span>）のやっていること</h3>
<ul>
<li>潜在空間のベクトルからデータを復元
<ul>
<li>例: 「犬」のベクトルが来たら犬の写真や絵を描画</li>
<li>復元方法（絵の描き方）を学習
<ul>
<li>転置畳み込みのフィルタなどのパラメータに</li>
</ul>
</li>
<li>復元しやすいようにエンコーダ側が学習される
<ul>
<li>潜在空間でのベクトルの分布が決まる</li>
</ul>
</li>
</ul>
</li>
</ul>
<p><img src="./figs/decoder.png" alt="" style="width:800px;" /></p>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="15" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="40" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./figs/autoenc2.png&quot;);background-size:95%;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="15" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="15" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="40" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="%E3%82%AA%E3%83%BC%E3%83%88%E3%82%A8%E3%83%B3%E3%82%B3%E3%83%BC%E3%83%80%E3%81%AE%E5%88%A9%E7%94%A8">オートエンコーダの利用</h3>
<ul>
<li>エンコーダとデコーダを分離して利用</li>
<li>エンコーダ
<ul>
<li>先に前結合層などを取り付けて分類器に</li>
<li>先に別のデコーダを取り付けると別のものが<span style="color:red">生成</span>される</li>
</ul>
</li>
<li>デコーダ
<ul>
<li>学習に用いたもの以外のエンコーダを取り付けると変換器に
<ul>
<li>例「犬」と入力<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container>犬の絵を<span style="color:red">生成</span></li>
</ul>
</li>
</ul>
</li>
</ul>
<center>GANとともに、ちまたで<span style="color:red">生成AI</span>と言われるものの原型</center>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="15" style="" data-marpit-pagination-total="40" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="16" style="--footer:ロボットビジョン第4回;--paginate:true;" data-marpit-pagination-total="40">
<h3 id="%E3%82%AA%E3%83%BC%E3%83%88%E3%82%A8%E3%83%B3%E3%82%B3%E3%83%BC%E3%83%80%E3%81%AE%E3%81%BE%E3%81%A8%E3%82%81">オートエンコーダのまとめ</h3>
<ul>
<li>画像（数百万次元の画素値のベクトル）を数十次元のベクトルに圧縮
<ul>
<li>人間もそうしてる？</li>
</ul>
</li>
<li>潜在空間のベクトルを狙って/適当にデコードすると画像になる
<ul>
<li>人間もそうやって風景を思い出したり幻想を見たりする？</li>
</ul>
</li>
<li>まだこれでは不完全
<ul>
<li>風景にも統計的な性質（確率分布）があるが、生かしきれていない
<ul>
<li>潜在空間に点を打っているだけ</li>
<li>点と点の間は「なにもない」ことに</li>
</ul>
</li>
<li>統計的な性質
<ul>
<li>同じ漫画家の書く人の絵は似ているとか猫の画像は互いに似ているとか</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="17" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="40" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./figs/vae_sparce.svg&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="65%" height="720"><section id="17" data-footer="ロボットビジョン第4回" data-paginate="true" lang="ja-JP" data-marpit-pagination="17" style="--footer:ロボットビジョン第4回;--paginate:true;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="40" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="%E7%A2%BA%E7%8E%87%E3%83%BB%E7%B5%B1%E8%A8%88%E3%81%A7%E8%80%83%E3%81%88%E3%82%8B%E7%94%BB%E5%83%8F%E3%81%AE%E5%88%86%E5%B8%83">確率・統計で考える画像の分布</h3>
<ul>
<li>こういう仮定を考える: 訓練画像はなんらかの確率分布Pにしたがって選ばれる
<ul>
<li>訓練画像を選ぶ人の嗜好や置かれた環境を反映した確率分布</li>
</ul>
</li>
<li>Pの性質: 確率（の密度）の高いところに、訓練に適切だが選ばれなかった画像が無数に存在
<ul>
<li><span style="color:red">選べると新しい画像が生成可能</span>
<ul>
<li>サイコロを振るように</li>
</ul>
</li>
<li><span style="color:red">問題: Pの分布の形が不明で選べない</span>
<ul>
<li>超多次元空間の超絶にスパース（疎）な分布</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>ロボットビジョン第4回</footer>
</section>
